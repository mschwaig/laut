name: Nix CI

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      run_large_test:
        description: 'Run large VM test'
        required: false
        type: boolean
        default: false
  push: # on push to any branch
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = flakes nix-command ca-derivations impure-derivations
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set-up cachix to push the results to
      uses: cachix/cachix-action@v13
      with:
        authToken: '${{ secrets.CACHIX_TOKEN }}'
        name: laut
    - name: Build Packages
      run: |
          nix run github:Mic92/nix-fast-build -- \
          --no-nom \
          --skip-cached \
          --flake "github:${GITHUB_REPOSITORY}/${GITHUB_SHA}#packages.x86_64-linux"

  vm-test:
    needs: nix-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: small-ca-sign
          - test: small-ca-verify
          - test: small-ia-sign
          - test: small-ia-verify
          - test: medium-ca-sign
          - test: medium-ca-verify
          - test: medium-ia-sign
          - test: medium-ia-verify
    name: VM Test ${{ matrix.test }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = flakes nix-command ca-derivations impure-derivations
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set-up cachix to push the results to
      uses: cachix/cachix-action@v13
      with:
        authToken: '${{ secrets.CACHIX_TOKEN }}'
        name: laut
    - name: Run VM Test
      run: |
          nix run github:Mic92/nix-fast-build -- \
          --no-nom \
          --skip-cached \
          --flake "github:${GITHUB_REPOSITORY}/${GITHUB_SHA}#checks.x86_64-linux.${{ matrix.test }}"
